# Deploy site to GitHub Pages from branch: stage-1-frontend-and-api
name: Pages Deploy

on:
  push:
    branches: [stage-1-frontend-and-api]
  # Optional manual dispatch — it will still only deploy when the workflow ref is the stage branch
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Debug info
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact for GitHub Pages
        # Make sure your production build outputs to `./dist`. Change `path:` if different.
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Enforce deploy only when the workflow run is for the stage branch
    if: github.ref == 'refs/heads/stage-1-frontend-and-api'
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
